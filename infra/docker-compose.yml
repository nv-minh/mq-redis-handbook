# Shared infrastructure for every lab. Start with `make up`.
#   make up                      redis, rabbitmq, kafka, nats, postgres
#   make up PROFILE=sentinel     + redis-master, 2 replicas, 3 sentinels
#   make up PROFILE=cluster      + 6 cluster nodes and the redis-cluster-init job
#
# Every published port is bound to 127.0.0.1 (default credentials, never expose them).
# Host ports of the base services can be overridden when something else already uses them,
# e.g. `REDIS_PORT=6390 make up`; then point the matching lab env var at the new port
# (REDIS_URL, AMQP_URL, KAFKA_BROKERS, NATS_URL, DATABASE_URL).
name: mq-handbook

x-redis-node: &redis-node
  image: redis:8.10.2
  restart: "no"

services:
  redis:
    image: redis:8.10.2
    # --dbfilename is a marker: lab 03 refuses to CONFIG SET maxmemory on a Redis that does not report it.
    # Harmless because persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dbfilename", "mq-handbook.rdb"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.6-management
    ports:
      - "127.0.0.1:${AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    configs:
      - source: rabbitmq_conf
        target: /etc/rabbitmq/conf.d/90-handbook.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 15s

  nats:
    image: nats:2.15.0-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: handbook
      POSTGRES_PASSWORD: handbook
      POSTGRES_DB: handbook
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbook -d handbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- profile: sentinel -------------------------------------------------------------------
  # Nodes announce their docker DNS name (not an IP), so Sentinel answers contain names such as
  # redis-master:6380. A client on the host must map them to 127.0.0.1 (ioredis `natMap`,
  # go-redis `Dialer`); the host port of every node equals its container port.
  redis-master:
    <<: *redis-node
    profiles: ["sentinel"]
    command:
      [
        "redis-server",
        "--port",
        "6380",
        "--protected-mode",
        "no",
        "--save",
        "",
        "--appendonly",
        "no",
        "--replica-announce-ip",
        "redis-master",
      ]
    ports:
      - "127.0.0.1:6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-replica-1:
    <<: *redis-node
    profiles: ["sentinel"]
    command:
      [
        "redis-server",
        "--port",
        "6381",
        "--protected-mode",
        "no",
        "--save",
        "",
        "--appendonly",
        "no",
        "--replicaof",
        "redis-master",
        "6380",
        "--replica-announce-ip",
        "redis-replica-1",
      ]
    ports:
      - "127.0.0.1:6381:6381"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-replica-2:
    <<: *redis-node
    profiles: ["sentinel"]
    command:
      [
        "redis-server",
        "--port",
        "6382",
        "--protected-mode",
        "no",
        "--save",
        "",
        "--appendonly",
        "no",
        "--replicaof",
        "redis-master",
        "6380",
        "--replica-announce-ip",
        "redis-replica-2",
      ]
    ports:
      - "127.0.0.1:6382:6382"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  sentinel-1: &sentinel
    <<: *redis-node
    profiles: ["sentinel"]
    hostname: sentinel-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/sentinel.conf <<CONF
        port $${SENTINEL_PORT}
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel announce-ip $${SENTINEL_HOST}
        sentinel announce-port $${SENTINEL_PORT}
        sentinel monitor mymaster redis-master 6380 2
        sentinel down-after-milliseconds mymaster 2000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        CONF
        exec redis-sentinel /tmp/sentinel.conf --protected-mode no
    environment:
      SENTINEL_HOST: sentinel-1
      SENTINEL_PORT: "26379"
    ports:
      - "127.0.0.1:26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${SENTINEL_PORT} ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  sentinel-2:
    <<: *sentinel
    hostname: sentinel-2
    environment:
      SENTINEL_HOST: sentinel-2
      SENTINEL_PORT: "26380"
    ports:
      - "127.0.0.1:26380:26380"

  sentinel-3:
    <<: *sentinel
    hostname: sentinel-3
    environment:
      SENTINEL_HOST: sentinel-3
      SENTINEL_PORT: "26381"
    ports:
      - "127.0.0.1:26381:26381"

  # ---- profile: cluster --------------------------------------------------------------------
  # Nodes announce their docker DNS name as the preferred endpoint, so MOVED redirections and
  # CLUSTER SLOTS contain names such as redis-cluster-1:7001. A client on the host must map them
  # to 127.0.0.1 (ioredis `natMap`, go-redis `Dialer`); the host port equals the container port.
  redis-cluster-1: &redis-cluster-node
    <<: *redis-node
    profiles: ["cluster"]
    hostname: redis-cluster-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec redis-server --port $${NODE_PORT} --protected-mode no --save "" --appendonly no --cluster-enabled yes --cluster-config-file /tmp/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname $$(hostname) --cluster-preferred-endpoint-type hostname
    environment:
      NODE_PORT: "7001"
    ports:
      - "127.0.0.1:7001:7001"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${NODE_PORT} ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cluster-2:
    <<: *redis-cluster-node
    hostname: redis-cluster-2
    environment:
      NODE_PORT: "7002"
    ports:
      - "127.0.0.1:7002:7002"

  redis-cluster-3:
    <<: *redis-cluster-node
    hostname: redis-cluster-3
    environment:
      NODE_PORT: "7003"
    ports:
      - "127.0.0.1:7003:7003"

  redis-cluster-4:
    <<: *redis-cluster-node
    hostname: redis-cluster-4
    environment:
      NODE_PORT: "7004"
    ports:
      - "127.0.0.1:7004:7004"

  redis-cluster-5:
    <<: *redis-cluster-node
    hostname: redis-cluster-5
    environment:
      NODE_PORT: "7005"
    ports:
      - "127.0.0.1:7005:7005"

  redis-cluster-6:
    <<: *redis-cluster-node
    hostname: redis-cluster-6
    environment:
      NODE_PORT: "7006"
    ports:
      - "127.0.0.1:7006:7006"

  # Forms the cluster once, then stays alive so `up --wait` only returns when cluster_state is ok.
  redis-cluster-init:
    <<: *redis-node
    profiles: ["cluster"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ! redis-cli -h redis-cluster-1 -p 7001 cluster info | grep -q 'cluster_state:ok'; then
          nodes=""
          for i in 1 2 3 4 5 6; do
            ip=$$(getent hosts redis-cluster-$$i | cut -d' ' -f1)
            nodes="$$nodes $$ip:700$$i"
          done
          redis-cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes
        fi
        exec sleep infinity
    depends_on:
      redis-cluster-1: { condition: service_healthy }
      redis-cluster-2: { condition: service_healthy }
      redis-cluster-3: { condition: service_healthy }
      redis-cluster-4: { condition: service_healthy }
      redis-cluster-5: { condition: service_healthy }
      redis-cluster-6: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -h redis-cluster-1 -p 7001 cluster info | grep -q 'cluster_state:ok'",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

configs:
  rabbitmq_conf:
    content: |
      default_queue_type = quorum
